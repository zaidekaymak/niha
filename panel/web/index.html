<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Baskı · Panel</title>
<style>
  :root{
    --bg:#fafafa; --surface:#ffffff; --line:#ececec; --text:#1a1a1a;
    --muted:#8a8a8a; --accent:#e8622c; --accent-soft:#fdf0eb;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f0f10; --surface:#191919; --line:#2a2a2a; --text:#f2f2f2;
      --muted:#8a8a8a; --accent:#ff6b3d; --accent-soft:#2a1a13; --shadow:0 1px 2px rgba(0,0,0,.3); }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px 80px}

  header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-size:14px}
  nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:4px}
  nav button{border:0;background:transparent;color:var(--muted);font-size:14px;
    padding:7px 16px;border-radius:7px;cursor:pointer;font-weight:500;transition:.15s}
  nav button.active{background:var(--accent);color:#fff}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow)}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stat .value{font-size:24px;font-weight:600;margin-top:4px}

  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .bar h2{font-size:18px;font-weight:600}
  .btn{border:0;background:var(--accent);color:#fff;font-size:14px;font-weight:500;
    padding:9px 16px;border-radius:9px;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
  .btn.sm{padding:5px 11px;font-size:13px}
  .btn.danger{background:transparent;color:#d64545;border:1px solid var(--line)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .grow{flex:1;min-width:0}
  .row .title{font-weight:500}
  .row .sub{font-size:13px;color:var(--muted)}
  .price{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty{padding:48px;text-align:center;color:var(--muted)}

  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
  .st-yeni{background:#eef2ff;color:#4657d6} .st-baskida{background:#fff4e5;color:#c47613}
  .st-kargoda{background:#e7f5ff;color:#1a7fc4} .st-teslim{background:#e8f7ee;color:#268a4f}
  .st-iptal{background:#fdeaea;color:#c23b3b}
  @media (prefers-color-scheme: dark){
    .st-yeni{background:#20243f} .st-baskida{background:#33260f} .st-kargoda{background:#0f2836}
    .st-teslim{background:#12291b} .st-iptal{background:#331717}
  }
  .badge{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums}

  /* Pipeline */
  .pipe{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .pipe button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--bg);
    color:var(--muted);font-size:12px;padding:6px;border-radius:7px;cursor:pointer;font-weight:500}
  .pipe button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;
    max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-h{padding:20px 22px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
  .modal-b{padding:22px}
  .modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
  .field{margin-bottom:16px}
  input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;background:var(--bg);color:var(--text)}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .checkrow{display:flex;gap:24px;margin-bottom:16px}
  .checkrow label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0;cursor:pointer}
  .checkrow input{width:auto}
  .costbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
  .costbox .kv{padding:5px 0;border:0}
  .costbox .kv.tot{border-top:2px solid var(--line);padding-top:8px;margin-top:4px;font-weight:600}
  .profit.pos{color:#268a4f} .profit.neg{color:#c23b3b}

  /* Giriş ekranı */
  #login-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);width:100%;max-width:360px;padding:28px}
  .login-err{color:#c23b3b;font-size:13px;min-height:18px;margin:2px 0 12px}
  .userbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .userbox .me{font-size:13px;color:var(--muted)}

  /* Detay */
  .kv{display:flex;justify-content:space-between;gap:16px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
  .kv:first-child{border-top:0}
  .kv .k{color:var(--muted);white-space:nowrap}
  .kv .v{text-align:right}
  .sec-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 4px}
  .sec-title:first-child{margin-top:0}

  .lineadd{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:end}
  .items{margin-top:12px}
  .item{display:flex;justify-content:space-between;align-items:center;font-size:14px;
    padding:8px 0;border-top:1px solid var(--line)}
  .item .x{cursor:pointer;color:#c23b3b;font-size:18px;line-height:1;padding:0 4px}
  .tot{display:flex;justify-content:space-between;font-weight:600;padding-top:10px;
    margin-top:6px;border-top:2px solid var(--line)}

  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    header{flex-direction:column;gap:14px;align-items:stretch}
    .two{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<!-- GİRİŞ EKRANI -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand" style="justify-content:center;margin-bottom:22px"><span class="dot">◈</span> 3D Baskı Paneli</div>
    <div class="field"><label>Kullanıcı Adı</label>
      <input id="l-user" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field" style="margin-bottom:6px"><label>Şifre</label>
      <input id="l-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="l-error" class="login-err"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Giriş Yap</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="brand"><span class="dot">◈</span> 3D Baskı Paneli</div>
    <div class="userbox">
      <nav>
        <button id="tab-orders" class="active" onclick="showTab('orders')">Siparişler</button>
        <button id="tab-products" onclick="showTab('products')">Ürünler</button>
        <button id="tab-filaments" onclick="showTab('filaments')">Filamentler</button>
        <button id="tab-users" onclick="showTab('users')">Kullanıcılar</button>
        <button id="tab-settings" onclick="showTab('settings')">Ayarlar</button>
      </nav>
      <span class="me" id="me-user"></span>
      <button class="btn ghost sm" onclick="doLogout()">Çıkış</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <!-- SİPARİŞLER -->
  <section id="view-orders">
    <div class="bar">
      <h2>Siparişler</h2>
      <button class="btn" onclick="openOrderModal()">+ Yeni Sipariş</button>
    </div>
    <div class="card" id="orders-list"></div>
  </section>

  <!-- ÜRÜNLER -->
  <section id="view-products" style="display:none">
    <div class="bar">
      <h2>Ürünler</h2>
      <button class="btn" onclick="openProductModal()">+ Yeni Ürün</button>
    </div>
    <div class="card" id="products-list"></div>
  </section>

  <!-- FİLAMENTLER -->
  <section id="view-filaments" style="display:none">
    <div class="bar">
      <h2>Filamentler</h2>
      <button class="btn" onclick="openFilamentModal()">+ Yeni Filament</button>
    </div>
    <div class="card" id="filaments-list"></div>
  </section>

  <!-- KULLANICILAR -->
  <section id="view-users" style="display:none">
    <div class="bar">
      <h2>Kullanıcılar</h2>
      <button class="btn" onclick="openUserModal()">+ Yeni Kullanıcı</button>
    </div>
    <div class="card" id="users-list"></div>
  </section>

  <!-- AYARLAR -->
  <section id="view-settings" style="display:none">
    <div class="bar"><h2>Maliyet Ayarları</h2></div>
    <div class="card" style="padding:22px">
      <div class="two">
        <div class="field"><label>Ambalaj Maliyeti (₺)</label><input id="s-packaging" type="number" min="0" step="0.01" placeholder="0"></div>
        <div class="field"><label>Sticker Maliyeti (₺)</label><input id="s-sticker" type="number" min="0" step="0.01" placeholder="0"></div>
      </div>
      <div class="field"><label>Saatlik Baskı Maliyeti (₺/saat)</label><input id="s-hourly" type="number" min="0" step="0.01" placeholder="0"></div>
      <div style="text-align:right"><button class="btn" onclick="saveSettings()">Kaydet</button></div>
    </div>
  </section>
</div>

<!-- ÜRÜN MODAL -->
<div class="overlay" id="product-modal">
  <div class="modal">
    <div class="modal-h" id="pm-title">Yeni Ürün</div>
    <div class="modal-b">
      <input type="hidden" id="p-id">
      <div class="field"><label>Ürün Adı</label><input id="p-name" placeholder="Örn: Kedi Figürü"></div>
      <div class="two">
        <div class="field"><label>Filament</label><select id="p-filament"></select></div>
        <div class="field"><label>Kullanılan (gram)</label><input id="p-grams" type="number" min="0" step="0.1" placeholder="0"></div>
      </div>
      <div class="two">
        <div class="field"><label>Baskı Süresi (saat)</label><input id="p-hours" type="number" min="0" step="0.1" placeholder="0"></div>
        <div class="field"><label>Stok</label><input id="p-stock" type="number" min="0" step="1" placeholder="0"></div>
      </div>
      <div class="checkrow">
        <label><input type="checkbox" id="p-packaging"> Ambalaj</label>
        <label><input type="checkbox" id="p-sticker"> Sticker</label>
      </div>
      <div class="costbox" id="p-costbox"></div>
      <div class="two">
        <div class="field"><label>Satış Fiyatı (₺)</label><input id="p-price" type="number" min="0" step="0.01" placeholder="0"></div>
        <div class="field"><label>Kâr</label><div id="p-profit" style="padding:10px 0"></div></div>
      </div>
      <div class="field"><label>Açıklama</label><textarea id="p-desc" rows="2" placeholder="Opsiyonel"></textarea></div>
    </div>
    <div class="modal-f">
      <button class="btn ghost" onclick="closeModal('product-modal')">Vazgeç</button>
      <button class="btn" onclick="saveProduct()">Kaydet</button>
    </div>
  </div>
</div>

<!-- FİLAMENT MODAL -->
<div class="overlay" id="filament-modal">
  <div class="modal">
    <div class="modal-h" id="fm-title">Yeni Filament</div>
    <div class="modal-b">
      <input type="hidden" id="f-id">
      <div class="field"><label>Filament Adı</label><input id="f-name" placeholder="Örn: PLA Siyah"></div>
      <div class="field"><label>Kilogram Fiyatı (₺/kg)</label><input id="f-price" type="number" min="0" step="0.01" placeholder="0"></div>
    </div>
    <div class="modal-f">
      <button class="btn ghost" onclick="closeModal('filament-modal')">Vazgeç</button>
      <button class="btn" onclick="saveFilament()">Kaydet</button>
    </div>
  </div>
</div>

<!-- KULLANICI MODAL -->
<div class="overlay" id="user-modal">
  <div class="modal">
    <div class="modal-h">Yeni Kullanıcı</div>
    <div class="modal-b">
      <div class="field"><label>Kullanıcı Adı</label><input id="u-name" autocomplete="off"></div>
      <div class="field"><label>Şifre</label><input id="u-pass" type="password" autocomplete="new-password"></div>
    </div>
    <div class="modal-f">
      <button class="btn ghost" onclick="closeModal('user-modal')">Vazgeç</button>
      <button class="btn" onclick="saveUser()">Kaydet</button>
    </div>
  </div>
</div>

<!-- SİPARİŞ MODAL -->
<div class="overlay" id="order-modal">
  <div class="modal">
    <div class="modal-h">Yeni Sipariş</div>
    <div class="modal-b">
      <div class="two">
        <div class="field"><label>Müşteri</label><input id="o-customer" placeholder="Ad Soyad"></div>
        <div class="field"><label>Telefon</label><input id="o-phone" placeholder="Opsiyonel"></div>
      </div>
      <div class="field"><label>Adres</label><textarea id="o-address" rows="2" placeholder="Teslimat adresi"></textarea></div>
      <label>Ürün Ekle</label>
      <div class="lineadd">
        <select id="o-product"></select>
        <input id="o-qty" type="number" min="1" value="1">
        <button class="btn sm" onclick="addLine()">Ekle</button>
      </div>
      <div class="items" id="o-items"></div>
      <div class="field" style="margin-top:16px"><label>Not</label><textarea id="o-note" rows="2" placeholder="Opsiyonel"></textarea></div>
    </div>
    <div class="modal-f">
      <button class="btn ghost" onclick="closeModal('order-modal')">Vazgeç</button>
      <button class="btn" onclick="saveOrder()">Siparişi Oluştur</button>
    </div>
  </div>
</div>

<!-- SİPARİŞ DETAY MODAL -->
<div class="overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-h" id="d-title">Sipariş Detayı</div>
    <div class="modal-b" id="d-body"></div>
    <div class="modal-f">
      <button class="btn danger" onclick="cancelFromDetail()">Siparişi İptal Et</button>
      <button class="btn ghost" onclick="closeModal('detail-modal')">Kapat</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  if (r.status === 401) showLogin();
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Hata');
  return d;
};
const fmt = n => new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n||0);
const STATUS = {yeni:'Yeni', baskida:'Baskıda', kargoda:'Kargoda', teslim:'Teslim', iptal:'İptal'};
const FLOW = ['yeni','baskida','kargoda','teslim'];

let products = [], orders = [], filaments = [], settings = {}, users = [], draftItems = [];
const TABS = ['orders','products','filaments','users','settings'];

function showTab(t){
  TABS.forEach(x => {
    $('#tab-'+x).classList.toggle('active', x===t);
    $('#view-'+x).style.display = x===t?'block':'none';
  });
}

async function refresh(){
  [products, orders, filaments, settings, users] = await Promise.all([
    api('/api/products'), api('/api/orders'), api('/api/filaments'),
    api('/api/settings'), api('/api/users'),
  ]);
  const s = await api('/api/stats');
  renderStats(s);
  renderProducts();
  renderFilaments();
  renderSettings();
  renderUsers();
  renderOrders();
}

/* ---------- Maliyet hesabı ---------- */
function calcCost(p){
  const f = filaments.find(x => x.id===p.filamentId);
  const filamentCost = f ? (p.grams||0)/1000*f.pricePerKg : 0;
  const printCost = (p.printHours||0)*(settings.hourlyCost||0);
  const packaging = p.usePackaging ? (settings.packagingCost||0) : 0;
  const sticker = p.useSticker ? (settings.stickerCost||0) : 0;
  return {filamentCost, printCost, packaging, sticker, total: filamentCost+printCost+packaging+sticker};
}

function renderStats(s){
  $('#stats').innerHTML = `
    <div class="stat"><div class="label">Aktif Sipariş</div><div class="value">${s.activeOrders}</div></div>
    <div class="stat"><div class="label">Toplam Sipariş</div><div class="value">${s.orders}</div></div>
    <div class="stat"><div class="label">Ürün Çeşidi</div><div class="value">${s.products}</div></div>
    <div class="stat"><div class="label">Ciro (teslim)</div><div class="value">${fmt(s.revenue)}</div></div>`;
}

/* ---------- Ürünler ---------- */
function renderProducts(){
  const el = $('#products-list');
  if(!products.length){ el.innerHTML = '<div class="empty">Henüz ürün yok. İlk ürününü ekle.</div>'; return; }
  el.innerHTML = products.map(p => {
    const c = calcCost(p);
    const f = filaments.find(x => x.id===p.filamentId);
    const meta = [f?esc(f.name):null, p.grams?p.grams+'g':null, p.printHours?p.printHours+'sa':null]
      .filter(Boolean).join(' · ') || esc(p.material||'');
    const profit = (p.price||0) - c.total;
    return `
    <div class="row">
      <div class="grow">
        <div class="title">${esc(p.name)}</div>
        <div class="sub">${meta}${p.description?(meta?' · ':'')+esc(p.description):''}</div>
        <div class="sub">Maliyet ${fmt(c.total)} · Kâr <span class="profit ${profit>=0?'pos':'neg'}">${fmt(profit)}</span></div>
      </div>
      <span class="badge">Stok ${p.stock}</span>
      <span class="price">${fmt(p.price)}</span>
      <button class="btn ghost sm" onclick='openProductModal(${JSON.stringify(p)})'>Düzenle</button>
      <button class="btn danger sm" onclick="delProduct('${p.id}')">Sil</button>
    </div>`;
  }).join('');
}

function openProductModal(p){
  $('#pm-title').textContent = p ? 'Ürünü Düzenle' : 'Yeni Ürün';
  $('#p-id').value = p?.id || '';
  $('#p-name').value = p?.name || '';
  $('#p-filament').innerHTML = filaments.length
    ? '<option value="">— Filament yok —</option>' + filaments.map(f =>
        `<option value="${f.id}">${esc(f.name)} — ${fmt(f.pricePerKg)}/kg</option>`).join('')
    : '<option value="">Önce filament ekleyin</option>';
  $('#p-filament').value = p?.filamentId || '';
  $('#p-grams').value = p?.grams ?? '';
  $('#p-hours').value = p?.printHours ?? '';
  $('#p-packaging').checked = !!p?.usePackaging;
  $('#p-sticker').checked = !!p?.useSticker;
  $('#p-price').value = p?.price ?? '';
  $('#p-desc').value = p?.description || '';
  updateCostBox();
  $('#product-modal').classList.add('show');
}

function productForm(){
  return {
    filamentId: $('#p-filament').value,
    grams: parseFloat($('#p-grams').value)||0,
    printHours: parseFloat($('#p-hours').value)||0,
    usePackaging: $('#p-packaging').checked,
    useSticker: $('#p-sticker').checked,
  };
}

function updateCostBox(){
  const p = productForm();
  const c = calcCost(p);
  const f = filaments.find(x => x.id===p.filamentId);
  $('#p-costbox').innerHTML = `
    <div class="kv"><span class="k">Filament${f?' ('+esc(f.name)+')':''}</span><span class="v">${fmt(c.filamentCost)}</span></div>
    <div class="kv"><span class="k">Baskı (${p.printHours||0} sa)</span><span class="v">${fmt(c.printCost)}</span></div>
    <div class="kv"><span class="k">Ambalaj</span><span class="v">${fmt(c.packaging)}</span></div>
    <div class="kv"><span class="k">Sticker</span><span class="v">${fmt(c.sticker)}</span></div>
    <div class="kv tot"><span class="k">Toplam Maliyet</span><span class="v">${fmt(c.total)}</span></div>`;
  const price = parseFloat($('#p-price').value)||0;
  const profit = price - c.total;
  const pct = price>0 ? Math.round(profit/price*100) : 0;
  $('#p-profit').innerHTML = price>0
    ? `<span class="profit ${profit>=0?'pos':'neg'}">${fmt(profit)} <small>(%${pct})</small></span>`
    : '<span class="sub">—</span>';
}

async function saveProduct(){
  const body = {
    name: $('#p-name').value.trim(),
    price: parseFloat($('#p-price').value)||0,
    stock: parseInt($('#p-stock').value)||0,
    description: $('#p-desc').value.trim(),
    ...productForm(),
  };
  if(!body.name){ alert('Ürün adı zorunlu'); return; }
  const id = $('#p-id').value;
  try{
    if(id) await api('/api/products/'+id, {method:'PUT', body:JSON.stringify(body)});
    else await api('/api/products', {method:'POST', body:JSON.stringify(body)});
    closeModal('product-modal'); refresh();
  }catch(e){ alert(e.message); }
}

async function delProduct(id){
  if(!confirm('Ürün silinsin mi?')) return;
  await api('/api/products/'+id, {method:'DELETE'}); refresh();
}

// Ürün modalındaki alanlar değişince maliyet/kâr canlı güncellensin.
['p-filament','p-grams','p-hours','p-packaging','p-sticker','p-price'].forEach(id => {
  const el = $('#'+id);
  el.addEventListener('input', updateCostBox);
  el.addEventListener('change', updateCostBox);
});

/* ---------- Filamentler ---------- */
function renderFilaments(){
  const el = $('#filaments-list');
  if(!filaments.length){ el.innerHTML = '<div class="empty">Henüz filament yok. İlk filamentini ekle.</div>'; return; }
  el.innerHTML = filaments.map(f => `
    <div class="row">
      <div class="grow"><div class="title">${esc(f.name)}</div></div>
      <span class="price">${fmt(f.pricePerKg)}/kg</span>
      <button class="btn ghost sm" onclick='openFilamentModal(${JSON.stringify(f)})'>Düzenle</button>
      <button class="btn danger sm" onclick="delFilament('${f.id}')">Sil</button>
    </div>`).join('');
}

function openFilamentModal(f){
  $('#fm-title').textContent = f ? 'Filamenti Düzenle' : 'Yeni Filament';
  $('#f-id').value = f?.id || '';
  $('#f-name').value = f?.name || '';
  $('#f-price').value = f?.pricePerKg ?? '';
  $('#filament-modal').classList.add('show');
}

async function saveFilament(){
  const body = { name: $('#f-name').value.trim(), pricePerKg: parseFloat($('#f-price').value)||0 };
  if(!body.name){ alert('Filament adı zorunlu'); return; }
  const id = $('#f-id').value;
  try{
    if(id) await api('/api/filaments/'+id, {method:'PUT', body:JSON.stringify(body)});
    else await api('/api/filaments', {method:'POST', body:JSON.stringify(body)});
    closeModal('filament-modal'); refresh();
  }catch(e){ alert(e.message); }
}

async function delFilament(id){
  if(!confirm('Filament silinsin mi?')) return;
  await api('/api/filaments/'+id, {method:'DELETE'}); refresh();
}

/* ---------- Ayarlar ---------- */
function renderSettings(){
  $('#s-packaging').value = settings.packagingCost ?? '';
  $('#s-sticker').value = settings.stickerCost ?? '';
  $('#s-hourly').value = settings.hourlyCost ?? '';
}

async function saveSettings(){
  const body = {
    packagingCost: parseFloat($('#s-packaging').value)||0,
    stickerCost: parseFloat($('#s-sticker').value)||0,
    hourlyCost: parseFloat($('#s-hourly').value)||0,
  };
  try{
    settings = await api('/api/settings', {method:'PUT', body:JSON.stringify(body)});
    renderProducts(); // maliyetler yeni ayarlara göre güncellensin
    alert('Ayarlar kaydedildi');
  }catch(e){ alert(e.message); }
}

/* ---------- Kullanıcılar ---------- */
function renderUsers(){
  const el = $('#users-list');
  if(!users.length){
    el.innerHTML = '<div class="empty">Panelden eklenmiş kullanıcı yok. Ana admin ortam değişkeninde tanımlı.</div>';
    return;
  }
  el.innerHTML = users.map(u => `
    <div class="row">
      <div class="grow"><div class="title">${esc(u.username)}</div>
        <div class="sub">${esc(u.createdAt||'')}</div></div>
      <button class="btn danger sm" onclick="delUser('${u.id}')">Sil</button>
    </div>`).join('');
}

function openUserModal(){
  $('#u-name').value=''; $('#u-pass').value='';
  $('#user-modal').classList.add('show');
}

async function saveUser(){
  const body = { username: $('#u-name').value.trim(), password: $('#u-pass').value };
  if(!body.username || !body.password){ alert('Kullanıcı adı ve şifre zorunlu'); return; }
  try{
    await api('/api/users', {method:'POST', body:JSON.stringify(body)});
    closeModal('user-modal');
    users = await api('/api/users'); renderUsers();
  }catch(e){ alert(e.message); }
}

async function delUser(id){
  if(!confirm('Kullanıcı silinsin mi?')) return;
  await api('/api/users/'+id, {method:'DELETE'});
  users = await api('/api/users'); renderUsers();
}

/* ---------- Oturum ---------- */
function showLogin(){
  $('#login-screen').style.display='flex';
  $('#app').style.display='none';
}
function showApp(username){
  $('#login-screen').style.display='none';
  $('#app').style.display='block';
  $('#me-user').textContent = username || '';
  refresh();
}

async function checkAuth(){
  try{
    const me = await api('/api/me');
    if(me.authenticated) showApp(me.username);
    else showLogin();
  }catch(e){ showLogin(); }
}

async function doLogin(){
  $('#l-error').textContent='';
  try{
    const r = await api('/api/login', {method:'POST',
      body:JSON.stringify({username:$('#l-user').value.trim(), password:$('#l-pass').value})});
    $('#l-pass').value='';
    showApp(r.username);
  }catch(e){ $('#l-error').textContent = e.message; }
}

async function doLogout(){
  try{ await api('/api/logout', {method:'POST'}); }catch(e){}
  showLogin();
}

/* ---------- Siparişler ---------- */
function renderOrders(){
  const el = $('#orders-list');
  if(!orders.length){ el.innerHTML = '<div class="empty">Henüz sipariş yok.</div>'; return; }
  el.innerHTML = orders.map(o => {
    const itemsTxt = o.items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ');
    const pipe = o.status==='iptal' ? '' : `<div class="pipe">${
      FLOW.map(s => `<button class="${FLOW.indexOf(o.status)>=FLOW.indexOf(s)?'on':''}"
        onclick="setStatus('${o.id}','${s}')">${STATUS[s]}</button>`).join('')
    }</div>`;
    return `
    <div class="row" style="flex-wrap:wrap">
      <div class="grow">
        <div class="title">${esc(o.customer)} <span class="badge">${o.id}</span></div>
        <div class="sub">${itemsTxt}${o.phone?' · '+esc(o.phone):''}${o.note?' · '+esc(o.note):''}</div>
        ${o.address?`<div class="sub">📍 ${esc(o.address)}</div>`:''}
        ${pipe}
      </div>
      <span class="pill st-${o.status}">${STATUS[o.status]}</span>
      <span class="price">${fmt(o.total)}</span>
      <button class="btn ghost sm" onclick="openDetail('${o.id}')">Detay</button>
    </div>`;
  }).join('');
}

async function setStatus(id, status){
  if(status==='iptal' && !confirm('Sipariş iptal edilsin mi?')) return;
  await api('/api/orders/'+id, {method:'PATCH', body:JSON.stringify({status})});
  await refresh();
  if(detailId===id) renderDetail(); // detay acıksa güncel durumu göster
}

/* ---------- Sipariş Detay ---------- */
let detailId = null;

function openDetail(id){
  detailId = id;
  renderDetail();
  $('#detail-modal').classList.add('show');
}

function renderDetail(){
  const o = orders.find(x => x.id===detailId);
  if(!o){ closeModal('detail-modal'); return; }
  $('#d-title').innerHTML = `Sipariş <span class="badge">${o.id}</span>
    <span class="pill st-${o.status}" style="margin-left:8px">${STATUS[o.status]}</span>`;

  const itemsHtml = o.items.map(i =>
    `<div class="item"><span>${i.qty}× ${esc(i.name)}</span>
      <span>${fmt(i.price*i.qty)}</span></div>`).join('')
    + `<div class="tot"><span>Toplam</span><span>${fmt(o.total)}</span></div>`;

  const pipe = o.status==='iptal' ? '<div class="sub">Bu sipariş iptal edildi.</div>'
    : `<div class="pipe">${FLOW.map(s =>
        `<button class="${FLOW.indexOf(o.status)>=FLOW.indexOf(s)?'on':''}"
          onclick="setStatus('${o.id}','${s}')">${STATUS[s]}</button>`).join('')}</div>`;

  $('#d-body').innerHTML = `
    <div class="sec-title">Müşteri</div>
    <div class="kv"><span class="k">Ad Soyad</span><span class="v">${esc(o.customer)}</span></div>
    ${o.phone?`<div class="kv"><span class="k">Telefon</span><span class="v">${esc(o.phone)}</span></div>`:''}
    ${o.address?`<div class="kv"><span class="k">Adres</span><span class="v">${esc(o.address)}</span></div>`:''}

    <div class="sec-title">Ürünler</div>
    <div class="items" style="margin-top:0">${itemsHtml}</div>

    <div class="sec-title">Durum</div>
    ${pipe}

    <div class="field" style="margin-top:18px"><label>Not</label>
      <textarea id="d-note" rows="2" placeholder="Sipariş notu…">${esc(o.note)}</textarea></div>
    <div style="text-align:right"><button class="btn sm" onclick="saveNote()">Notu Kaydet</button></div>

    <div class="sec-title">Zaman</div>
    <div class="kv"><span class="k">Oluşturuldu</span><span class="v">${esc(o.createdAt)}</span></div>
    <div class="kv"><span class="k">Güncellendi</span><span class="v">${esc(o.updatedAt)}</span></div>`;
}

async function saveNote(){
  const note = $('#d-note').value.trim();
  await api('/api/orders/'+detailId, {method:'PATCH', body:JSON.stringify({note})});
  await refresh();
  renderDetail();
}

async function cancelFromDetail(){
  if(!confirm('Sipariş iptal edilsin mi?')) return;
  await api('/api/orders/'+detailId, {method:'PATCH', body:JSON.stringify({status:'iptal'})});
  await refresh();
  renderDetail();
}

function openOrderModal(){
  $('#o-customer').value=''; $('#o-phone').value=''; $('#o-address').value=''; $('#o-note').value=''; $('#o-qty').value=1;
  draftItems = [];
  $('#o-product').innerHTML = products.length
    ? products.map(p => `<option value="${p.id}">${esc(p.name)} — ${fmt(p.price)}</option>`).join('')
    : '<option value="">Önce ürün ekleyin</option>';
  renderDraft();
  $('#order-modal').classList.add('show');
}

function addLine(){
  const pid = $('#o-product').value;
  const p = products.find(x => x.id===pid);
  if(!p){ alert('Ürün seçin'); return; }
  const qty = parseInt($('#o-qty').value)||1;
  const ex = draftItems.find(x => x.productId===pid);
  if(ex) ex.qty += qty;
  else draftItems.push({productId:p.id, name:p.name, price:p.price, qty});
  renderDraft();
}

function renderDraft(){
  const el = $('#o-items');
  if(!draftItems.length){ el.innerHTML=''; return; }
  let total = 0;
  el.innerHTML = draftItems.map((i,idx)=>{
    total += i.price*i.qty;
    return `<div class="item"><span>${i.qty}× ${esc(i.name)}</span>
      <span>${fmt(i.price*i.qty)} <span class="x" onclick="rmLine(${idx})">×</span></span></div>`;
  }).join('') + `<div class="tot"><span>Toplam</span><span>${fmt(total)}</span></div>`;
}

function rmLine(i){ draftItems.splice(i,1); renderDraft(); }

async function saveOrder(){
  // Kullanici "Ekle"ye basmadan dogrudan olusturduysa, secili urunu ekle.
  if(!draftItems.length && $('#o-product').value) addLine();
  const body = {
    customer: $('#o-customer').value.trim(),
    phone: $('#o-phone').value.trim(),
    address: $('#o-address').value.trim(),
    note: $('#o-note').value.trim(),
    items: draftItems,
  };
  if(!body.customer){ alert('Müşteri adı zorunlu'); return; }
  if(!body.items.length){ alert('En az bir ürün ekleyin'); return; }
  try{
    await api('/api/orders', {method:'POST', body:JSON.stringify(body)});
    closeModal('order-modal'); refresh();
  }catch(e){ alert(e.message); }
}

/* ---------- Yardımcı ---------- */
function closeModal(id){ $('#'+id).classList.remove('show'); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.querySelectorAll('.overlay').forEach(o =>
  o.addEventListener('click', e => { if(e.target===o) o.classList.remove('show'); }));

checkAuth();
</script>
</body>
</html>
